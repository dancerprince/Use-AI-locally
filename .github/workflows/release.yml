name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v3
      - run: python3 scripts/build_release.py
      - name: Smoke test installed wheel
        run: |
          uv tool install backend/dist/*.whl
          offline-ai version
          offline-ai paths
      - uses: actions/upload-artifact@v4
        with: { name: wheel, path: backend/dist/* }

  binary:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v3
      - run: npm ci && npm run build:bundle
        working-directory: frontend
      - run: uv sync --project backend
      - run: uv run --project backend --with pyinstaller pyinstaller --noconfirm packaging/offline-ai.spec
      - shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../offline-ai-${{ runner.os }}.zip offline-ai; \
          else tar czf ../offline-ai-${{ runner.os }}.tar.gz offline-ai; fi
      - uses: actions/upload-artifact@v4
        with: { name: binary-${{ runner.os }}, path: "offline-ai-*" }

  publish:
    needs: [wheel, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
            scripts/install.sh
            scripts/install.ps1
